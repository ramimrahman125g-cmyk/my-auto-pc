name: Ubuntu True RDP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Update & Install Desktop + XRDP
      run: |
        sudo apt update
        sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies xrdp dbus-x11
        sudo systemctl enable xrdp
        echo "startxfce4" > ~/.xsession
        sudo adduser runner ssl-cert || true

    - name: Set Password
      run: |
        echo "runner:12345678" | sudo chpasswd
        sudo usermod -aG sudo runner

    - name: Configure XRDP
      run: |
        sudo sed -i 's/^exec.*/exec startxfce4/' /etc/xrdp/xrdp.ini || true
        sudo systemctl restart xrdp

    - name: Start Pinggy & Auto-Update Website URL
      run: |
        echo "Starting Pinggy Tunnel..."
        git config --global user.name "RDP Bot"
        git config --global user.email "bot@github.com"

        # Run ssh and capture output to extract the port/link automatically
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io 2>&1 | while read -r line; do
          echo "$line"
          if echo "$line" | grep -q "tcp://"; then
            URL=$(echo "$line" | grep -o 'tcp://[^[:space:]]*')
            echo "$URL" > rdp-url.txt
            echo "Generated URL: $URL"
            
            git add rdp-url.txt
            git commit -m "Auto update RDP URL [skip ci]" || true
            git push || true
          fi
        done
        
