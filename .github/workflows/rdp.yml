name: Powerful Linux RDP

on:
  workflow_dispatch:

jobs:
  build-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup System & Desktop Environment
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y tigervnc-standalone-server xfce4 xfce4-goodies curl wget
          
          mkdir -p ~/.vnc
          echo "12345678" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          echo -e "#!/bin/bash\nunset SESSION_MANAGER\nunset DBUS_SESSION_BUS_ADDRESS\nstartxfce4 &" > ~/.vnc/xstartup
          chmod +x ~/.vnc/xstartup

      - name: Start VNC Server
        run: |
          vncserver :1 -geometry 1280x720 -depth 24

      - name: Start Stable Pinggy TCP Tunnel
        run: |
          echo "=========================================="
          echo "RDP IS READY! COPY THE TCP LINK BELOW:"
          echo "=========================================="
          while true; do
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -p 443 -R 0:localhost:5901 tcp@a.pinggy.io || echo "Reconnecting tunnel..."
            sleep 3
          done
          
